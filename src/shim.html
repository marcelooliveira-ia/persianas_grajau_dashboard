<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
const CSV={{CSV_JSON}};
function parseCSV(t){const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else{q=false;}}else{cur+=c;}}
  else if(c==='"'){q=true;}
  else if(c===','){row.push(cur);cur='';}
  else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
  else if(c!=='\r'){cur+=c;}
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 const h=rows.shift();return rows.filter((r)=>r.length>1||r[0]!=='').map((r)=>{const o={};h.forEach((k,i)=>{o[k]=r[i]===undefined?'':r[i];});return o;});
}
const store={};Object.keys(CSV).forEach((k)=>{store[k]=parseCSV(CSV[k]);});
const draws=[];
window.dash={
 data:(id)=>store[id]?{status:'ok',data:store[id],message:'',refreshing:false,meta:[]}:{status:'missing',data:[],message:'',refreshing:false,meta:[]},
 calc:(id,o)=>{store[id]=o.fn(...o.inputs.map((i)=>store[i]));},
 draw:(name,fn)=>{draws.push([name,fn]);}
};
window.__run=()=>{draws.forEach((d)=>{document.querySelectorAll('[data-draw="'+d[0]+'"]').forEach((el)=>{try{if(typeof d[1]==='function'){d[1](el);}else if(!el.__mounted){el.__mounted=true;el.__made=d[1].mount(el);}else if(d[1].update){d[1].update(el,el.__made);}}catch(e){console.error(d[0],e);}});});};
</script>
